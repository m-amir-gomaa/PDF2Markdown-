name: Pageweft checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Official action tag commits resolved from GitHub API on 2026-10-14.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -q
      - run: ruff check --select E9,F63,F7,F82,F401 web/books.py web/credits.py web/documents.py web/studio.py web/operations.py web/inspect_worker.py scripts/operations.py scripts/build_public_example.py tests/test_operations.py app.py modal_fn.py
      - run: node --check static/app.js
      - run: git diff --check
